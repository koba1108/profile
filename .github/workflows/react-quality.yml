name: React Quality

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies
        run: |
          npm audit --audit-level=moderate
          npm audit --omit=dev --audit-level=moderate

      - name: Typecheck, lint, unit test, build and public artifact audit
        run: npm run check

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: End-to-end and accessibility tests
        run: npm run test:e2e

      - name: Lighthouse thresholds
        run: npm run test:lighthouse

      - name: Upload browser test evidence on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: react-quality-failure-evidence
          path: |
            playwright-report/
            test-results/
            tmp/lighthouse/
          if-no-files-found: ignore
          retention-days: 7
